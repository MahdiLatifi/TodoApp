{% load static %}
{% load my_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {#    <link rel="preload" href="{% static 'fonts/niafam-icons.woff' %}" as="font" type="font/woff" crossorigin>#}
    {#    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">#}
</head>

<body>
<div class="container">
    <div class="div-form" id="login-form">
        {% header %}
        <h1>Todos</h1>
        <div class="content">
            <form method="post" action="{% url 'add_todo' %}">
                {% csrf_token %}
                <input type="text" id="title" name="title" placeholder="new todo...">
                <button class="add-btn" type="submit">➕</button>
                <hr>
            </form>
            <div id="content">
                {% for todo in todos %}
                    {% if todo.is_complete %}
                        <div class="todo deleted-todo" id="todo-{{ todo.id }}">
                            <h3>{{ todo.title }}</h3>
                            <button class="delete-btn undo-btn" type="button" onclick="undoTodo({{ todo.id }})">✔</button>
                        </div>
                    {% else %}
                        <div class="todo" id="todo-{{ todo.id }}">
                            <h3>{{ todo.title }}</h3>
                            <button class="delete-btn" type="button" onclick="deleteTodo({{ todo.id }})">🔘</button>
                        </div>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>
</div>
<script>
    const addTodoUrl = "{% url 'add_todo' %}"
</script>
<script src="{% static 'js/app.js' %}"></script>
</body>

</html>
